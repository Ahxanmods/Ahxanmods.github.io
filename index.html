            min-height: 100vh;

            border: 5px solid #f3f3f3;

            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;

        @keyframes spin {

            margin-top: 20px;
            font-weight: bold;
            transition: transform 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
