<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="🚀 Ahxanmods - Game Hub. Play & Download Mods. Install on your device for app-like experience.">
    <meta name="keywords" content="Ahxanmods, game hub, mods, gaming, online games, play games, PWA, install app">
    <meta name="author" content="Ahxanmods">
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Ahxanmods">
    <link rel="manifest" href="manifest.json">
    
    <title>Ahxanmods - Download & Install</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #667eea;
            --secondary-color: #764ba2;
            --dark-bg: #0a0e27;
            --card-bg: #1a1f3a;
            --text-primary: #ffffff;
            --text-secondary: #b0b8d4;
            --light-bg: #f0f4ff;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #16213e 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }
        
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0.4;
            z-index: -1;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 30px;
            padding: 50px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: slideUp 0.6s ease;
            color: #333;
        }
        
        .logo-container {
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }
        
        .logo-icon {
            font-size: 60px;
            display: inline-block;
            margin-bottom: 15px;
        }
        
        .title {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #f0f0f0;
            border-top: 6px solid var(--primary-color);
            border-radius: 50%;
            margin: 30px auto;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            font-size: 14px;
            color: #999;
            margin-top: 20px;
            margin-bottom: 30px;
            font-weight: 500;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 40px;
        }
        
        .btn {
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn-install {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .btn-install:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        
        .btn-install:active {
            transform: translateY(-1px);
        }
        
        .btn-website {
            background: #f0f0f0;
            color: #333;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-website:hover {
            background: #e8e8e8;
            transform: translateY(-2px);
        }
        
        .btn-website:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .icon {
            font-size: 20px;
        }
        
        .footer {
            font-size: 12px;
            color: #999;
            margin-top: 40px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            line-height: 1.8;
        }
        
        .footer-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            animation: slideDown 0.3s ease;
        }
        
        .status-message.show {
            display: block;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 40px 25px;
                border-radius: 25px;
            }
            
            .title {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 14px;
            }
            
            .btn {
                padding: 14px 28px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    
    <div class="container">
        <!-- Logo Section -->
        <div class="logo-container">
            <div class="logo-icon">🎮</div>
            <h1 class="title">Ahxanmods</h1>
        </div>
        
        <!-- Description -->
        <p class="subtitle">
            Game Hub - Play & Download Mods
        </p>
        
        <!-- Loading Spinner -->
        <div class="loading-spinner"></div>
        <div class="loading-text">Aapka Game Hub load ho raha hai...</div>
        
        <!-- Buttons -->
        <div class="button-container">
            <button class="btn btn-install" id="installBtn">
                <span class="icon">⬇️</span>
                <span>Install Now</span>
            </button>
            
            <button class="btn btn-website" id="websiteBtn">
                <span class="icon">🌐</span>
                <span>Continue to Website</span>
            </button>
        </div>
        
        <!-- Status Message -->
        <div id="statusMessage" class="status-message"></div>
        
        <!-- Footer -->
        <div class="footer">
            <p>© 2026 Ahxanmods. All rights reserved.</p>
            <p style="margin-top: 8px;">Powered by Replit | Hosted on GitHub Pages</p>
        </div>
    </div>
    
    <!-- Service Worker Registration & Auto-Redirect Logic -->
    <script>
        const installBtn = document.getElementById('installBtn');
        const websiteBtn = document.getElementById('websiteBtn');
        const statusMessage = document.getElementById('statusMessage');
        const container = document.querySelector('.container');
        let deferredPrompt = null;
        
        // Show status message
        function showStatus(message, type = 'success') {
            statusMessage.textContent = message;
            statusMessage.className = `status-message show status-${type}`;
            setTimeout(() => {
                statusMessage.classList.remove('show');
            }, 3000);
        }
        
        // Check if app is already installed (running as PWA)
        function checkIfAppInstalled() {
            // Check if running as standalone PWA
            if (window.navigator.standalone === true) {
                console.log('📱 App already installed - Running as PWA');
                autoRedirectToWebsite();
                return true;
            }
            
            // Check localStorage for app installed flag
            if (localStorage.getItem('ahxanmods-app-installed') === 'true') {
                console.log('📱 App already installed - Redirecting');
                autoRedirectToWebsite();
                return true;
            }
            
            return false;
        }
        
        // Auto redirect to website
        function autoRedirectToWebsite() {
            container.style.opacity = '0.7';
            const spinner = document.querySelector('.loading-spinner');
            const loadingText = document.querySelector('.loading-text');
            loadingText.textContent = 'App already installed! Redirecting to Game Hub...';
            
            setTimeout(() => {
                window.location.href = 'https://ahxanmods-game-hub--tecnicalrexo.replit.app/';
            }, 1500);
        }
        
        // Website button - redirect to game hub
        websiteBtn.addEventListener('click', () => {
            window.location.href = 'https://ahxanmods-game-hub--tecnicalrexo.replit.app/';
        });
        
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => {
                    console.log('✅ Service Worker registered');
                })
                .catch(err => {
                    console.log('Service Worker error:', err);
                });
        }
        
        // Listen for beforeinstallprompt event
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.disabled = false;
            showStatus('✅ Install option available! Click "Install Now"', 'success');
        });
        
        // Install button click
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                try {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    
                    if (outcome === 'accepted') {
                        showStatus('🎉 Ahxanmods installed successfully!', 'success');
                        // Store installation flag
                        localStorage.setItem('ahxanmods-app-installed', 'true');
                        installBtn.disabled = true;
                        installBtn.textContent = '✓ Installed';
                        
                        // Redirect after 2 seconds
                        setTimeout(() => {
                            autoRedirectToWebsite();
                        }, 2000);
                    } else {
                        showStatus('Installation cancelled', 'error');
                    }
                    
                    deferredPrompt = null;
                } catch (error) {
                    showStatus('❌ Installation failed', 'error');
                }
            } else {
                showStatus('⚠️ Install not available. Use "Continue to Website" instead', 'error');
            }
        });
        
        // App installed event
        window.addEventListener('appinstalled', () => {
            console.log('🎊 App installed!');
            localStorage.setItem('ahxanmods-app-installed', 'true');
            showStatus('🎊 App installed! Redirecting...', 'success');
            installBtn.disabled = true;
            installBtn.textContent = '✓ Installed';
            
            // Auto redirect after 1.5 seconds
            setTimeout(() => {
                autoRedirectToWebsite();
            }, 1500);
        });
        
        // Check on page load if app is already installed
        window.addEventListener('load', () => {
            checkIfAppInstalled();
        });
        
        // Also check immediately
        checkIfAppInstalled();
    </script>
</body>
</html>
